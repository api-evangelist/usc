      documented public web service is the Schedule of Classes (SOC) Web Services
      API, referenced by USC documentation URLs and a publicly observed archive API
      endpoint pattern, but the host (web-app.usc.edu) refused connections from this
      review's network at probe time, so endpoints could not be independently
      verified live. The official website, USC digital library, course catalogue,
      and departmental/research GitHub organizations (uscdatascience, isi-usc-edu)
      resolved successfully. No endpoints were fabricated; only confirmed-resolving
      or USC-documented URLs are recorded.
