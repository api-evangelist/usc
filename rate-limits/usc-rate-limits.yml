description: >-
  University of Southern California publishes no rate-limit documentation of any kind, for any
  surface. Corrected 2026-08-30: the previous text here cited OAI-PMH, IIIF and library
  harvesting endpoints as the throttled surfaces, and USC operates none of them - every OAI-PMH
  path probed on digitallibrary.usc.edu, repository.usc.edu and the Ex Libris Alma gateway for
  institution code 01USC_INST failed. Clients of the two keyless USC surfaces that do exist
  (shibboleth.usc.edu metadata, facebase.org ERMrest) should still back off politely and honor
  Retry-After; no published limit governs either.
notes: Confirm per-service limits with each API's documentation; harvest responsibly.
