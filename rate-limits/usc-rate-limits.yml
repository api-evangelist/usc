- https://raw.githubusercontent.com/api-evangelist/usc/refs/heads/main/apis.yml
responseCodes:
  throttled: 429
limits:
- name: Default
  scope: client
  metric: requests-per-minute
  limit: none published
  notes: >-
    No rate limit is published or advertised on any USC-operated surface, and no 429 or
    RateLimit-* header was observed on any probe. Absence of a documented limit is not a
    guarantee of an unlimited service.
policies:
- name: Backoff Strategy
  description: Exponential backoff with jitter; honor Retry-After; harvest during off-peak hours.
