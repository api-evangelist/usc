- aid: usc:figshare-repository
  name: USC Figshare Research Repository (Tenant)
  x-operator: tenant
  description: >-
    USC Libraries offers Figshare to USC researchers as its data-output repository for datasets,
    posters and presentations, at the institution-specific tenant usc.figshare.com. Probed
    2026-08-30 the host answers 202 behind an AWS WAF JavaScript challenge (window.awsWafCookie),
    which is a block on automated clients rather than an absence — the tenant is live. Recorded
    as a relationship only. No Figshare specification is saved under USC: api.figshare.com/v2 is
    the generic vendor contract every Figshare customer shares, and attributing it to an
    institution is precisely the misattribution this profile exists to avoid — one Figshare
    contract was previously credited to twenty-five universities across this cohort. The data and
    the DOIs are USC's; the contract is Figshare's and belongs in Figshare's own repo.
  humanURL: https://libguides.usc.edu/resdata
