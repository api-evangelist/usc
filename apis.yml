- aid: usc:digital-library-cortex
  name: USC Digital Library API (Orange Logic Cortex)
  x-operator: tenant
  description: >-
    A live, token-gated REST API on USC's own host running Orange Logic's Cortex digital asset
    platform. GET https://digitallibrary.usc.edu/API/search/v3.0/search?query=test&format=json
    returns 401 application/json with a fully formed Cortex envelope — APIRequestInfo naming
    ProviderVersion PRINCETON.R6.2293U.273257, ProviderIdentity USC-AWS-ORG-209, Module search,
    APIVersion v3.0 — and the message "you must be signed in to access to this functionality.
    Please request a token through the Authentication." /API/Authentication/v1.0/Login answers
    405 to GET, confirming the auth resource exists. The deployment, the host, the 1.5 million
    DOIs it mints as DataCite client usc.dl and the collections themselves are USC's; the
    contract is Orange Logic's product API, identical across every Cortex customer, so no spec is
    saved under USC. Tokens are not self-service and there is no public API documentation on any
    USC host, so this surface is recorded but not readable.
  humanURL: https://digitallibrary.usc.edu/
  baseURL: https://digitallibrary.usc.edu/API/search/v3.0/search
