- aid: usc:datacite-membership
  name: USC DataCite DOI Registration (Provider Account)
  x-operator: tenant
  description: >-
    USC holds a DataCite direct membership in its own name and mints DOIs for eleven USC
    repositories under it. GET https://api.datacite.org/providers/usc returns 200 with name
    "University of Southern California", memberType direct_member, organizationType
    academicInstitution, joined 2017-06-02 and rorId https://ror.org/03taz7m60. The account
    carries 1,513,793 DOIs across usc.dl (USC Digital Library, 1,511,764), usc.facebase (1,410),
    usc.ini (Stevens Neuroimaging and Informatics Institute, 284), usc.isi (123), usc.gateway
    (Gateway to Global Aging Data, 105), usc.kidney (57), usc.metrans (35), usc.dataverse (9),
    usc.cesr (6), usc.pgahp and usc.test. Recorded as tenant, not institution: the REST API is
    DataCite's contract and every DataCite member shares it, so no spec is saved here. What is
    USC's is the account, the eleven repositories and the DOIs — a real and substantial
    institutional fact that this profile carried nowhere before.
  humanURL: https://research.usc.edu/research-and-scholarship/digital-usc/
