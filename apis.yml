description: >-
  The University of Southern California is a private research university in Los Angeles,
  ranked #59 in the QS World University Rankings 2025. USC operates no central developer
  portal, publishes no OpenAPI, AsyncAPI or apis.json anywhere on its public surface, and
  issues no self-service API keys — www.usc.edu serves neither llms.txt nor
  .well-known/security.txt, and api.usc.edu is a default IIS Windows Server placeholder page
  last modified in 2019, not an API. What USC does operate, verified live on 2026-08-30, is
  three genuinely institutional machine surfaces: a Shibboleth SAML 2.0 identity provider whose
  metadata is published unauthenticated at shibboleth.usc.edu and registered with InCommon as
  urn:mace:incommon:usc.edu; a DataCite direct membership under its own name that carries
  eleven repositories and 1.5 million minted DOIs; and the FaceBase craniofacial data hub,
  whose keyless ERMrest REST API is built and run by USC's own Information Sciences Institute
  on ISI's Apache-2.0 DERIVA stack. Everything else that looks like a USC API is a vendor's
  contract running under USC's name and is recorded here as a tenant relationship, never as
  USC's engineering: Figshare, Ex Libris Primo/Alma, Orange Logic Cortex and Instructure
  Canvas. The Schedule of Classes Web Services API that this profile previously led with is
  gone — web-app.usc.edu no longer resolves at all.
