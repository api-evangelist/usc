- aid: usc:schedule-of-classes
  name: USC Schedule of Classes (SOC) — Web Services API, retired
  x-operator: institution
  description: >-
    USC's Schedule of Classes Web Services API, which exposed terms, departments, courses and
    sections and once powered the online schedule, is retired. Its host, web-app.usc.edu, no
    longer resolves at all: authoritative queries to 8.8.8.8 and 1.1.1.1 both return NOERROR with
    zero A records, while usc.edu, classes.usc.edu, shibboleth.usc.edu and api.usc.edu all
    resolve normally from the same resolvers. Both Documentation pointers this profile previously
    carried — /web/soc/help and /web/soc/docs/html/ — were therefore dead and have been removed;
    search engines still index them, which is exactly why link presence is not evidence. The
    schedule now runs at classes.usc.edu as an Angular single-page application, verified live
    2026-08-30. Its backend is not published: every /api/* path returns a bare 404 from a real
    backend while every other path soft-200s the 105KB SPA shell, the compiled bundle contains no
    API base URL (it is injected at runtime, with an interceptor that stamps X-CSRF on any
    *.usc.edu request), and USC has announced no successor API. The entry is kept, and kept
    honest, because the retirement of a real institutional surface is itself the finding.
  humanURL: https://classes.usc.edu/
