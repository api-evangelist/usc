  state: covered
  reason: covered
  detail: >-
    USC publishes no API contract of any kind — no OpenAPI, AsyncAPI, GraphQL SDL, Postman
    collection or apis.json exists on any usc.edu host, no USC GitHub organization contains one
    (code search over USCDataScience, isi-usc-edu, usc-its and uscbiostats returns 0 hits for
    filename:openapi), and there is no developer portal, no key issuance and no rate-limit
    documentation. Three institution-operated machine surfaces were found and verified live on
    2026-08-30 and are recorded as USC's: the Shibboleth/SAML 2.0 identity provider metadata at
    shibboleth.usc.edu plus its InCommon registration, the DataCite direct membership (provider
    id usc, 11 repositories, 1,513,793 DOIs), and the FaceBase ERMrest catalog API, which is
    keyless and returns 923,861 bytes of live JSON schema and whose own annotations are
    namespaced tag:isrd.isi.edu — USC ISI's Informatics Systems Research Division, which
    authors the Apache-2.0 ERMrest server. Four vendor platforms are recorded as tenant
    relationships and NOT as USC contracts: Figshare (usc.figshare.com), Ex Libris Primo/Alma
    (uosc.primo.exlibrisgroup.com, view 01USC_INST:01USC), Orange Logic Cortex
    (digitallibrary.usc.edu/API, which is a real REST API but returns 401 "you must be signed
    in ... request a token through the Authentication" with ProviderIdentity USC-AWS-ORG-209),
    and Instructure Canvas (usc.instructure.com). The Schedule of Classes Web Services API this
    profile previously led with is retired: web-app.usc.edu returns no A record from either
    8.8.8.8 or 1.1.1.1, so both Documentation pointers it carried were dead and have been
    removed. Its successor, classes.usc.edu, is an Angular single-page application whose backend
    is unpublished — /api/* returns bare 404s from a real backend while every non-/api path soft
    -200s the SPA shell. State is `covered` because two institution-operated machine surfaces were
    reached keyless and read in full, not because a portal was found — there is none. The one
    full REST API on a USC-owned host, the Orange Logic Cortex API, is the single gated surface:
    it exists and answers, but requires a token nobody outside USC can request. gateway.usc.edu and registrar.usc.edu resolve but do not answer
    publicly; libraries.usc.edu returns a 403 "old-browser" challenge to every user agent tried,
    which is a block on us rather than a finding about USC.
